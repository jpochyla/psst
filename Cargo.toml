[workspace]
resolver = "2"
members = ["psst-core", "psst-cli", "psst-gui", "vendor/librespot-connect"]
exclude = ["vendor/librespot-playback"]

[patch.crates-io]
# Upstream 0.8.0 plus local queue observation/enqueue; no extra Web API requests.
librespot-connect = { path = "vendor/librespot-connect" }
librespot-playback = { path = "vendor/librespot-playback" }

[profile.dev]
opt-level = 1
debug = true
lto = false

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

[profile.dev.package.symphonia]
opt-level = 2

[profile.dev.package.libsamplerate]
opt-level = 2
